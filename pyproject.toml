[project]
name = "esp32-receiver"
version = "0.1.0"
description = "ESP32 Image Receiver and Phone Usage Detector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "inference-sdk>=0.12.0",
    "num2words>=0.5.14",
    "numpy>=2.4.5",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "rfdetr>=1.6.5.post2",
    "supervision>=0.27.0.post2",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "transformers>=5.8.1",
    "uvicorn>=0.47.0",
]

[project.scripts]
esp32-receiver = "esp32_receiver.main:app"

[tool.setuptools.packages.find]
where = ["src"]

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    labels:
      - "esp32=true"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-esp32}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esp32}
      POSTGRES_DB: ${POSTGRES_DB:-esp32_events}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  receiver:
    build: .
    labels:
      - "esp32=true"
    ports:
      - "0.0.0.0:8003:8003"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://esp32:esp32@postgres:5432/esp32_events}
    volumes:
      - ./frames:/app/frames
      - ./outputs:/app/outputs
      - ./.env:/app/.env
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
